name: build

on:
  push:
    branches: [ main, app, reader-probe ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore FMScout.slnx

      - name: Build
        run: dotnet build FMScout.slnx -c Release --no-restore

      # unit tests + validation of fm27-layout.json (LayoutTests.ShippedLayoutIsComplete)
      - name: Test
        run: dotnet test tests/FM27Scout.Tests -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Publish single exe
        run: dotnet publish src/FM27Scout -c Release -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: FM27Scout
          path: publish/FM27Scout.exe

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: tests/FM27Scout.Tests/TestResults/*.trx
